name: Caching Demo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cache-demo:
    runs-on: ubuntu-latest
    
    steps:
      # Required for Question 6: Email step
      - name: 23f3004301@ds.study.iitm.ac.in
        run: |
          echo "Student: 23f3004301@ds.study.iitm.ac.in"
          echo "Repository: ${{ github.repository }}"
      
      # Checkout code
      - name: Checkout
        uses: actions/checkout@v4
      
      # Required for Question 7: Cache with required key
      - name: Cache dependencies
        id: cache-7eeaf97
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /tmp/demo-cache
          key: cache-7eeaf97-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cache-7eeaf97-${{ runner.os }}-
      
      # Required for Question 7: Prime cache step
      - name: prime-cache-7eeaf97
        run: |
          echo "=================================="
          echo "CACHE STATUS REPORT"
          echo "=================================="
          echo "Cache Key: cache-7eeaf97"
          echo "Cache Hit: ${{ steps.cache-7eeaf97.outputs.cache-hit }}"
          echo ""
          if [ "${{ steps.cache-7eeaf97.outputs.cache-hit }}" == "true" ]; then
            echo "✅ CACHE HIT - Dependencies restored from cache"
          else
            echo "❌ CACHE MISS - Will create and save cache"
          fi
          echo "=================================="
      
      # Create cache content (only on cache miss)
      - name: Create cache content
        if: steps.cache-7eeaf97.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/demo-cache
          echo "Cached data created at $(date)" > /tmp/demo-cache/data.txt
          echo "✅ Cache content created"
      
      # Verify cache
      - name: Verify cache
        run: |
          if [ -f "/tmp/demo-cache/data.txt" ]; then
            echo "✅ Cache verified"
            cat /tmp/demo-cache/data.txt
          else
            echo "ℹ️ Cache file will be created"
          fi
      
      # Summary
      - name: Summary
        run: |
          echo "✅ Workflow completed successfully"
          echo "✅ Email step present: 23f3004301@ds.study.iitm.ac.in"
          echo "✅ Cache key: cache-7eeaf97"
          echo "✅ Prime cache step: prime-cache-7eeaf97"
