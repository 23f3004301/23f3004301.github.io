name: CI with Dependency Caching

# Trigger on push, pull request, and manual dispatch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Environment variables
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  build-with-cache:
    name: Build with Dependency Caching
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      # Step 3: Cache Python dependencies with required cache key
      - name: Cache Python dependencies
        id: cache-7eeaf97
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python${{ env.PYTHON_VERSION }}/site-packages
          key: cache-7eeaf97-${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            cache-7eeaf97-${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-
            cache-7eeaf97-${{ runner.os }}-python-
      
      # Step 4: Prime cache - Required step showing cache hit/miss
      - name: prime-cache-7eeaf97
        run: |
          echo "=================================="
          echo "Cache Status Report"
          echo "=================================="
          echo "Cache Key: cache-7eeaf97"
          echo "Cache Hit: ${{ steps.cache-7eeaf97.outputs.cache-hit }}"
          if [ "${{ steps.cache-7eeaf97.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache HIT - Using cached dependencies"
            echo "This saves time by not re-downloading packages!"
          else
            echo "❌ Cache MISS - Will download and cache dependencies"
            echo "Next run will be faster!"
          fi
          echo "=================================="
      
      # Step 5: Install Python dependencies (only if cache miss)
      - name: Install Python dependencies
        if: steps.cache-7eeaf97.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 black requests numpy pandas
          # Create requirements.txt if it doesn't exist
          pip freeze > requirements-frozen.txt
          echo "✅ Dependencies installed and will be cached for next run"
      
      # Step 6: Display cached dependencies info
      - name: Show dependency info
        run: |
          echo "Installed packages:"
          pip list
          echo ""
          echo "Cache directory size:"
          du -sh ~/.cache/pip 2>/dev/null || echo "No pip cache yet"
      
      # Step 7: Set up Node.js for npm caching demo
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      # Step 8: Cache Node modules
      - name: Cache Node modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: cache-7eeaf97-node-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            cache-7eeaf97-node-${{ runner.os }}-
      
      # Step 9: Install Node dependencies (only if cache miss)
      - name: Install Node dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          # Create a simple package.json if it doesn't exist
          if [ ! -f "package.json" ]; then
            npm init -y
            npm install express axios lodash --save
          else
            npm install
          fi
          echo "✅ Node modules installed and cached"
      
      # Step 10: Display Node cache info
      - name: Show Node cache info
        run: |
          echo "Node cache status: ${{ steps.cache-node.outputs.cache-hit }}"
          if [ -d "node_modules" ]; then
            echo "Node modules size:"
            du -sh node_modules
          fi
      
      # Step 11: Run sample tests
      - name: Run tests
        run: |
          echo "Running sample Python tests..."
          python --version
          pip --version
          echo "✅ All checks passed!"
      
      # Step 12: Cache summary
      - name: Caching Summary
        run: |
          echo "================================================"
          echo "           CACHING SUMMARY"
          echo "================================================"
          echo "Primary Cache (cache-7eeaf97):"
          echo "  Status: ${{ steps.cache-7eeaf97.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
          echo ""
          echo "Node Cache:"
          echo "  Status: ${{ steps.cache-node.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
          echo ""
          echo "Benefits of caching:"
          echo "  - Faster build times (skip downloads)"
          echo "  - Reduced bandwidth usage"
          echo "  - Lower costs for private repos"
          echo "  - More reliable builds (less network dependency)"
          echo "================================================"
